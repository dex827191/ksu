name: Build SSH Protocol KSU (ARM64)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm64:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Use the Android SDK already installed on GitHub's Ubuntu runner.
      # Avoid setup-android: it may try to install the obsolete SDK package "tools".
      - name: Install Android NDK (ARM64)
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo 'sdkmanager not found in Android SDK installation' >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install 'platform-tools' 'ndk;27.2.12479018'

      - name: Build KernelSU WebUI bundle
        run: |
          cd webui
          npm install
          npm run build

      - name: Build Go SSH engine (Android ARM64)
        shell: bash
        run: |
          set -euxo pipefail
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          TOOL="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export GOOS=android GOARCH=arm64 CGO_ENABLED=1
          export CC="$TOOL/aarch64-linux-android21-clang"
          go mod tidy
          go build -trimpath -ldflags='-s -w' -o module/bin/sshprotocol ./cmd/sshprotocol

      - name: Build HEV (Android ARM64)
        shell: bash
        run: |
          set -euxo pipefail
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          TOOL="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          git clone --depth 1 --recursive https://github.com/heiher/hev-socks5-tunnel /tmp/hev
          cd /tmp/hev
          make \
            CC="$TOOL/aarch64-linux-android21-clang" \
            PP="$TOOL/aarch64-linux-android21-clang -E" \
            AR="$TOOL/llvm-ar" \
            STRIP="$TOOL/llvm-strip" \
            exec
          install -D -m 0755 bin/hev-socks5-tunnel "$GITHUB_WORKSPACE/module/bin/hev-socks5-tunnel"

      - name: Assemble ARM64 KernelSU module
        shell: bash
        run: |
          set -euxo pipefail
          chmod 0755 module/*.sh module/bin/*
          cd module
          zip -r ../SSHProtocol-KSU-arm64.zip .

      - name: Upload ARM64 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SSHProtocol-KSU-arm64
          path: SSHProtocol-KSU-arm64.zip
          if-no-files-found: error
